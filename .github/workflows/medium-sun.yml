{
  "jobs": {
    "sun": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "env": {
            "NASA_API_KEY": "${{ secrets.NASA_API_KEY }}"
          },
          "name": "is the sun exactly it",
          "run": "# Every push runs this, including ones from other rituals and from\n# master. A branch with no SUN.md has nothing to be wrong about.\nif [ ! -f SUN.md ]; then echo \"no SUN.md on this ref\"; exit 0; fi\nif [ -z \"$NASA_API_KEY\" ]; then echo \"no NASA_API_KEY in this repo\"; exit 1; fi\n\n# 90 days, not 7: measured 2026-08-10, DONKI's most recent flare was\n# 2026-07-30, so a seven-day window is empty and there is nothing to\n# be right about.\nfrom=$(date -u -d '90 days ago' +%F)\nto=$(date -u +%F)\n# catalog is pinned so a moving default cannot change the answer.\ncurl -sS --fail-with-body \\\n  \"https://api.nasa.gov/DONKI/FLR?startDate=$from&endDate=$to&catalog=M2M_CATALOG&api_key=$NASA_API_KEY\" \\\n  > flares.json\njq -r '.[-10:][] | \"\\(.flrID) \\(.classType)\"' flares.json > want.txt\n\n# What is wrong is said without saying what would be right. The agent\n# has to find that out where the answer actually lives.\nif ! diff -q want.txt SUN.md >/dev/null 2>&1; then\n  echo \"rejected: SUN.md has $(wc -l < SUN.md) lines, DONKI's last ten are $(wc -l < want.txt)\"\n  diff want.txt SUN.md | head -20 | sed 's/^/rejected: /'\n  exit 1\nfi\necho \"accepted\"\n"
        }
      ]
    }
  },
  "name": "medium-sun",
  "on": {
    "push": {
      "paths": [
        "SUN.md"
      ]
    }
  }
}
