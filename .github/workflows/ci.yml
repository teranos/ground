{
  "jobs": {
    "comet": {
      "if": "github.event_name == 'workflow_dispatch'",
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "fetch-depth": 0,
            "path": "ground"
          }
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "path": "project",
            "ref": "${{ inputs.rev }}",
            "repository": "${{ inputs.project }}"
          }
        },
        {
          "uses": "cachix/install-nix-action@v30"
        },
        {
          "name": "The comet's one project",
          "run": "mkdir -p ground/controls/local\nprintf 'project {\\n  path: \"%s\"\\n}\\n' \"$GITHUB_WORKSPACE/project\" > ground/controls/local/comet.pbt\n"
        },
        {
          "name": "Built with that project's sand",
          "run": "nix develop .#default --command make build",
          "working-directory": "ground"
        },
        {
          "name": "What it links",
          "run": "otool -L ground",
          "working-directory": "ground"
        },
        {
          "id": "name",
          "run": "echo \"artifact=ground-aarch64-darwin-$(echo '${{ inputs.project }}' | tr / -)\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "${{ steps.name.outputs.artifact }}",
            "path": "ground/ground"
          }
        }
      ]
    },
    "github-release": {
      "if": "startsWith(github.ref, 'refs/tags/')",
      "needs": "release",
      "permissions": {
        "contents": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/download-artifact@v8"
        },
        {
          "run": "ls -R"
        },
        {
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "files": "ground-*/ground-*\n"
          }
        }
      ]
    },
    "release": {
      "if": "startsWith(github.ref, 'refs/tags/')",
      "needs": "test",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "cachix/install-nix-action@v30"
        },
        {
          "run": "nix build .#ground"
        },
        {
          "run": "cp result/bin/ground ground-${{ matrix.target }}"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "ground-${{ matrix.target }}",
            "path": "ground-${{ matrix.target }}"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "os": "ubuntu-latest",
              "target": "x86_64-linux"
            },
            {
              "os": "macos-latest",
              "target": "aarch64-darwin"
            }
          ]
        }
      }
    },
    "test": {
      "if": "github.event_name != 'workflow_dispatch'",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "cachix/install-nix-action@v30"
        },
        {
          "run": "nix build .#ground"
        },
        {
          "run": "nix develop .#default --command sh -c 'make wind && dub test'"
        },
        {
          "run": "nix develop .#default --command sh -c 'make ug && make test-ug'"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ]
        }
      }
    }
  },
  "name": "CI",
  "on": {
    "pull_request": null,
    "push": {
      "branches": [
        "main",
        "count-one"
      ],
      "tags": [
        "*"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "project": {
          "description": "the repository whose controls the comet folds in, owner/repo",
          "required": true,
          "type": "string"
        },
        "rev": {
          "description": "the project's rev the comet is built from",
          "required": true,
          "type": "string"
        }
      }
    }
  }
}
