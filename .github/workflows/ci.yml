{
  "name": "CI",
  "on": { "pull_request": null },
  "jobs": {
    "asan-probe": {
      "runs-on": "macos-latest",
      "steps": [
        { "uses": "actions/checkout@v6" },
        { "uses": "cachix/install-nix-action@v30" },
        { "run": "nix config show | grep -E '^(sandbox|sandbox-fallback|system) '; sw_vers; uname -a" },
        { "run": "set -x; JD=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#json_c.dev); JL=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#json_c.out); CC=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#clang)/bin/cc; $CC --version; cd libacp && mkdir -p build && $CC -Iinclude -I$JD/include -I$JD/include/json-c -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tests/initialize.c src/acp.c src/initialize.c src/session.c src/modes.c src/config.c src/prompt.c -L$JL/lib -ljson-c -Wl,-rpath,$JL/lib -o build/initialize-sanitized && otool -L build/initialize-sanitized", "shell": "bash" },
        { "run": "cd libacp && (ASAN_OPTIONS=verbosity=2 ./build/initialize-sanitized > probe.out 2>&1; echo \"exit=$?\" >> probe.out) & sleep 30; pid=$(pgrep -f build/initialize-sanitized | head -1); echo \"pid=$pid\"; if [ -n \"$pid\" ]; then ps -o pid,stat,etime,command -p $pid; sudo sample $pid 3 -file /dev/stdout | head -150; sudo kill -9 $pid; fi; sleep 1; echo '--- output'; head -100 libacp/probe.out 2>/dev/null || head -100 probe.out", "shell": "bash" }
      ]
    }
  }
}
