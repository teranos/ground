{
  "name": "CI",
  "on": { "pull_request": null },
  "jobs": {
    "asan-probe": {
      "runs-on": "macos-latest",
      "steps": [
        { "uses": "actions/checkout@v6" },
        { "uses": "cachix/install-nix-action@v30" },
        { "run": "nix config show | grep -E '^(sandbox|sandbox-fallback|system) '; sw_vers; uname -a" },
        { "run": "nix develop .#default --command sh -c 'cd libacp && mkdir -p build && $CC --version && $CC -Iinclude $(pkg-config --cflags json-c) -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tests/initialize.c src/acp.c src/initialize.c src/session.c src/modes.c src/config.c src/prompt.c $(pkg-config --libs json-c) -o build/initialize-sanitized && otool -L build/initialize-sanitized'" },
        { "run": "cd libacp && (ASAN_OPTIONS=verbosity=2 nix develop ..#default --command ./build/initialize-sanitized > probe.out 2>&1 &); sleep 30; pid=$(pgrep -f build/initialize-sanitized | head -1); echo \"pid=$pid\"; if [ -n \"$pid\" ]; then ps -o pid,stat,etime,command -p $pid; sudo sample $pid 3 -file /dev/stdout | head -120; sudo kill -9 $pid; fi; echo '--- output'; head -80 probe.out", "shell": "bash" }
      ]
    }
  }
}
