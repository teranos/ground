name: short-moon

# The judge. The rite that pushed this commit never checked whether MOON.md is
# right — it only checked that something was written. This is the only place
# the answer is known.
on:
  push:
    paths: ['MOON.md']

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: is the moon exactly it
        run: |
          # Every push runs this, including ones from other rituals and from
          # master. A branch with no MOON.md has nothing to be wrong about.
          if [ ! -f MOON.md ]; then echo "no MOON.md on this ref"; exit 0; fi
          want=$(curl -sS 'https://wttr.in/?format=%m')
          got=$(cat MOON.md)
          # What is wrong is said without saying what would be right. The agent
          # has to find that out where the answer actually lives.
          if [ "$want" != "$got" ]; then
            case "$got" in
              🌑|🌒|🌓|🌔|🌕|🌖|🌗|🌘) echo "rejected: not the right emoji" ;;
              *)                      echo "rejected: is not an emoji" ;;
            esac
            exit 1
          fi
          echo "accepted"
