{
  "jobs": {
    "moon": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "is the moon exactly it",
          "run": "# Every push runs this, including ones from other rituals and from\n# master. A branch with no MOON.md has nothing to be wrong about.\nif [ ! -f MOON.md ]; then echo \"no MOON.md on this ref\"; exit 0; fi\nwant=$(curl -sS 'https://wttr.in/?format=%m')\ngot=$(cat MOON.md)\n# What is wrong is said without saying what would be right. The agent\n# has to find that out where the answer actually lives.\nif [ \"$want\" != \"$got\" ]; then\n  case \"$got\" in\n    🌑|🌒|🌓|🌔|🌕|🌖|🌗|🌘) echo \"rejected: not the right emoji\" ;;\n    *)                      echo \"rejected: is not an emoji\" ;;\n  esac\n  exit 1\nfi\necho \"accepted\"\n"
        }
      ]
    }
  },
  "name": "short-moon",
  "on": {
    "push": {
      "paths": [
        "MOON.md"
      ]
    }
  }
}
