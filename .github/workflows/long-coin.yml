{
  "jobs": {
    "coinflip": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "wait",
          "run": "sleep 15"
        },
        {
          "if": "${{ inputs.rig == 'tails' }}",
          "name": "rigged tails",
          "run": "echo \"tails\"\nexit 1\n"
        },
        {
          "if": "${{ inputs.rig == 'heads' }}",
          "name": "rigged heads",
          "run": "echo \"heads\""
        },
        {
          "if": "${{ inputs.rig == '' || inputs.rig == 'none' }}",
          "name": "flip",
          "run": "# One in a thousand it lands on its side: neither face, and it stays\n# there until the job is cancelled out from under it.\nif [ $((RANDOM % 1000)) -eq 0 ]; then\n  echo \"the coin is standing on its edge\"\n  sleep 3600\nfi\nif [ $((RANDOM % 2)) -eq 0 ]; then\n  echo \"heads\"\n  exit 0\nfi\necho \"tails\"\nexit 1\n"
        }
      ],
      "timeout-minutes": 20
    }
  },
  "name": "long-coin",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "ground": {
          "default": "",
          "description": "the performance and rite that dispatched this",
          "type": "string"
        },
        "rig": {
          "default": "none",
          "description": "which face both sides carry",
          "options": [
            "none",
            "heads",
            "tails"
          ],
          "type": "choice"
        }
      }
    }
  },
  "run-name": "long-coin ${{ inputs.ground }}"
}
